[package]
name = "midi-piano-roll"
version = "2.0.1"
edition = "2021"

[dependencies]
crossbeam-channel = "0.5.17"
memmap2 = "0.9.12"
midir = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal_size = "0.4.4"
unicode-width = "0.2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Media",
  "Win32_Foundation",
  "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
